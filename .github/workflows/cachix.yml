name: "Build & Push to Cachix"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
         #- system: aarch64-darwin
         #  os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: yutsuna
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        run: nix build -L .#packages.${{ matrix.system }}.default

      - name: Build devShell (pour cacher aussi les deps du shell)
        run: nix build -L .#devShells.${{ matrix.system }}.default

